<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>2026년 검토 프로젝트 · 사업개발팀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
<style>
  :root{
    --ink:#111827;--ink2:#3C4763;--ink3:#7B86A0;--line:#E1E5EE;--bg:#EEF0F5;--surface:#fff;
    --navy:#1F3A93;--blue:#2A55E5;--coral:#E8543C;--amber:#C08411;--green:#1E8F63;
    --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
    --sans:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1440px;margin:0 auto;padding:26px 20px 56px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;flex-wrap:wrap;margin-bottom:18px}
  .eyebrow{margin:0 0 5px;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--navy)}
  h1{margin:0;font-size:clamp(27px,3.2vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
  h1 span{color:var(--ink3);font-weight:700}
  .kpis{display:flex;gap:9px;flex-wrap:wrap}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 15px;min-width:98px}
  .kpi b{display:block;font-family:var(--mono);font-size:23px;letter-spacing:-.02em;line-height:1.15}
  .kpi small{color:var(--ink3);font-size:11px;font-weight:700}
  .kpi.accent{background:var(--ink);border-color:var(--ink)}
  .kpi.accent b{color:#fff}.kpi.accent small{color:#9BA6C2}
  .grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
  .card-h{padding:13px 17px 0;font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--ink3)}
  aside{display:flex;flex-direction:column;gap:13px;position:sticky;top:18px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:11px 13px 15px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit;transition:.15s}
  .chip:hover{border-color:var(--ink3)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip i{font-style:normal;font-family:var(--mono);opacity:.55;margin-left:5px}
  .rank{padding:9px 11px 13px}
  .rank button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px;border-radius:9px;cursor:pointer;font-family:inherit;text-align:left}
  .rank button:hover{background:#F4F6FA}
  .rank .dot{width:10px;height:10px;border-radius:3px;flex:none}
  .rank .nm{font-size:12.5px;font-weight:700;width:60px;flex:none}
  .rank .bar{flex:1;height:7px;background:#EDEFF5;border-radius:99px;overflow:hidden}
  .rank .bar i{display:block;height:100%;border-radius:99px}
  .rank .ct{font-family:var(--mono);font-size:12px;color:var(--ink3);width:14px;text-align:right}
  .outside{padding:7px 11px 13px;display:flex;flex-direction:column;gap:3px}
  .outside button{display:flex;align-items:baseline;gap:7px;width:100%;background:none;border:0;padding:7px;border-radius:9px;cursor:pointer;font-family:inherit;text-align:left}
  .outside button:hover{background:#F4F6FA}
  .outside .rg{font-size:12px;font-weight:800;width:66px;flex:none}
  .outside .pj{font-size:12px;color:var(--ink2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mapwrap{position:relative;padding:4px 8px 12px;overflow:hidden}
  .maphead{display:flex;justify-content:space-between;align-items:center;padding:14px 12px 4px;gap:12px;flex-wrap:wrap}
  .maphead p{margin:0;font-size:12.5px;color:var(--ink3);font-weight:600}
  .legend{display:flex;gap:11px;font-size:11.5px;color:var(--ink3);font-weight:700}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:3px;display:block}
  svg.map{display:block;width:100%;height:auto}
  .cell{cursor:pointer}
  .cell .shape{stroke:#fff;stroke-width:1.6;stroke-linejoin:round;transition:fill .25s,opacity .25s}
  .lift{transition:transform .5s cubic-bezier(.22,.9,.24,1),filter .5s}
  .cell.hov .lift{transform:translateY(-3px)}
  .cell.on.sg .lift{filter:drop-shadow(0 22px 22px rgba(17,24,39,.3)) drop-shadow(0 5px 7px rgba(17,24,39,.14))}
  .cell.on .bob{animation:bob 3.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .cell .lbl .cnt{font-family:var(--mono);font-size:.86em;font-weight:700;fill:var(--navy)}
  .cell .lbl{font-weight:800;fill:var(--ink);text-anchor:middle;pointer-events:none;letter-spacing:-.02em;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
  .cell.empty .lbl{fill:#9BA3B6;font-weight:600}
  .pin circle{fill:var(--navy);stroke:#fff;stroke-width:1.6;transition:fill .2s}
  .pin text{fill:#fff;font-family:var(--mono);font-size:10px;font-weight:700;text-anchor:middle;pointer-events:none}
  .pin{cursor:pointer}
  .pin:hover circle{fill:var(--coral)}
  .pin.mute circle{fill:#C3C9D6}
  .cell.dim .shape{opacity:.28}
  .cell.dim .lbl{opacity:.3}
  .cell.dim .pin{opacity:.25}
  .river{fill:none;stroke:#BBD8F2;stroke-width:18;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .rivl{font-size:11.5px;font-weight:800;fill:#6D94BE;letter-spacing:.34em;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px}
  .pop{position:absolute;width:350px;max-width:calc(100% - 22px);background:#fff;border:1px solid var(--line);border-radius:16px;
    box-shadow:0 28px 60px -18px rgba(17,24,39,.38),0 4px 12px rgba(17,24,39,.08);opacity:0;transform:translateY(8px) scale(.97);
    pointer-events:none;transition:opacity .2s,transform .22s cubic-bezier(.22,.9,.24,1);z-index:20;overflow:hidden}
  .pop.show{opacity:1;transform:none;pointer-events:auto}
  .pop-h{padding:13px 15px 11px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
  .pop-h .sw{width:11px;height:32px;border-radius:4px;flex:none;margin-top:2px}
  .pop-h h3{margin:0;font-size:18.5px;font-weight:800;letter-spacing:-.025em}
  .pop-h p{margin:1px 0 0;font-size:11.5px;font-weight:700;color:var(--ink3)}
  .pop-h button{margin-left:auto;border:0;background:#F1F3F8;width:26px;height:26px;border-radius:8px;cursor:pointer;color:var(--ink2);font-size:14px;flex:none}
  .pop-h button:hover{background:#E4E8F2}
  .pop-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .pop-stats div{background:#FBFCFE;padding:8px 15px}
  .pop-stats dt{margin:0;font-size:10.5px;font-weight:800;color:var(--ink3);letter-spacing:.03em}
  .pop-stats dd{margin:1px 0 0;font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:-.03em}
  .pop-stats dd small{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--ink3);margin-left:2px}
  .pop-b{max-height:224px;overflow:auto;padding:5px 0 7px}
  .row{padding:8px 15px;display:grid;grid-template-columns:24px 1fr auto;gap:3px 9px;align-items:baseline;transition:background .4s}
  .row+.row{border-top:1px dashed #EEF1F7}
  .row.hl{background:#FFF6E6}
  .row .no{font-family:var(--mono);font-size:10.5px;color:#fff;background:var(--navy);border-radius:99px;text-align:center;padding:1px 0;font-weight:700}
  .row .no.x{background:#CBD1DD}
  .row .tt{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
  .row .meta{grid-column:2/4;font-size:11px;color:var(--ink3);font-weight:600;font-family:var(--mono)}
  .tag{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap}
  .t-drop{background:#FCE9E5;color:var(--coral)}.t-go{background:#E4ECFF;color:var(--blue)}
  .t-watch{background:#FBF1DC;color:var(--amber)}.t-mou{background:#E0F3EA;color:var(--green)}
  .t-none{background:#F0F2F7;color:#98A0B4}
  .pop-f{padding:9px 15px;background:#F8F9FC;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);font-weight:600;display:flex;gap:10px;flex-wrap:wrap}
  details.all{margin-top:16px}
  details.all summary{cursor:pointer;list-style:none;padding:14px 18px;font-size:13px;font-weight:800;display:flex;gap:8px;align-items:center}
  details.all summary::-webkit-details-marker{display:none}
  details.all summary::after{content:"▾";margin-left:auto;color:var(--ink3);transition:.2s}
  details.all[open] summary::after{transform:rotate(180deg)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:11px;letter-spacing:.07em;color:var(--ink3);padding:8px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#FAFBFD}
  td{padding:8px 12px;border-bottom:1px solid #F0F2F7}
  td.n,td.d{font-family:var(--mono);color:var(--ink3);font-size:11.5px}
  td.p{font-weight:700}
  tbody tr:hover{background:#F8F9FC}
  footer{margin-top:24px;font-size:11.5px;color:var(--ink3);font-weight:600;text-align:right}
  #backdrop{position:fixed;inset:0;background:rgba(17,24,39,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
  #backdrop.show{opacity:1;pointer-events:auto}
  .sheet-grip{display:none}
  @media (min-width:641px){#backdrop{display:none}}
  @media (max-width:1000px){.grid{grid-template-columns:1fr}aside{position:static;order:2}.pop{width:min(340px,calc(100vw - 40px))}}
  @media (max-width:640px){
    .wrap{padding:16px 12px 36px}
    header.top{gap:13px;margin-bottom:14px}
    h1{font-size:23px}
    .eyebrow{font-size:11px;margin-bottom:3px}
    .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
    .kpi{min-width:0;padding:8px 10px;border-radius:11px}
    .kpi b{font-size:18px}
    .kpi small{font-size:10px;line-height:1.25;display:block}
    .grid{gap:11px}
    .card{border-radius:14px}
    .card-h{padding:12px 14px 0;font-size:11px}
    .mapwrap{padding:2px 4px 6px}
    .maphead{padding:12px 10px 0;gap:6px}
    .maphead p{font-size:11.5px}
    .legend{font-size:10.5px;gap:9px}
    .chips{padding:10px 10px 12px;gap:5px}
    .chip{padding:7px 12px;font-size:12.5px}
    .rank{padding:6px 8px 10px}
    .rank button{padding:8px 6px}
    .rank .nm{width:56px;font-size:12px}
    .outside{padding:5px 8px 10px}
    .outside button{padding:9px 6px}
    .outside .rg{width:60px;font-size:11.5px}
    /* 지도: 번호 마커·미검토 구 라벨 숨김 */
    .cell .pin{display:none}
    .cell.empty .lbl{display:none}
    .cell.hov .lift{transform:none}
    /* 팝업 → 하단 시트 */
    .pop{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;max-width:none;
      border-radius:20px 20px 0 0;border-bottom:0;transform:translateY(102%);opacity:1;
      transition:transform .3s cubic-bezier(.22,.9,.24,1);max-height:82vh;overflow:auto;
      box-shadow:0 -12px 40px rgba(17,24,39,.3);z-index:60;
      padding-bottom:env(safe-area-inset-bottom,0px)}
    .pop.show{transform:translateY(0)}
    .sheet-grip{display:block;width:38px;height:4px;border-radius:99px;background:#D8DDE8;margin:8px auto 0}
    .pop-h{padding:10px 16px 12px}
    .pop-h h3{font-size:19px}
    .pop-h button{width:32px;height:32px;font-size:15px}
    .pop-stats div{padding:9px 16px}
    .pop-b{max-height:36vh}
    .row{padding:11px 16px}
    .row .tt{font-size:14px}
    details.all summary{padding:13px 14px}
    th,td{padding:7px 9px;font-size:11.5px}
    footer{text-align:left;margin-top:18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">사업개발팀</p>
      <h1>2026년 검토 프로젝트 <span>· 지역별 현황</span></h1>
    </div>
    <div class="kpis">
      <div class="kpi accent"><b>41</b><small>전체 검토</small></div>
      <div class="kpi"><b>35</b><small>서울</small></div>
      <div class="kpi"><b>6</b><small>기타 지역</small></div>
      <div class="kpi"><b>13</b><small>도심권(중구·종로)</small></div>
      <div class="kpi"><b>7</b><small>마포구</small></div>
    </div>
  </header>

  <div class="grid">
    <aside>
      <section class="card"><div class="card-h">결과 필터</div><div class="chips" id="chips"></div></section>
      <section class="card"><div class="card-h">자치구별 검토 건수</div><div class="rank" id="rank"></div></section>
      <section class="card"><div class="card-h">서울 외 프로젝트 6건</div><div class="outside" id="outside"></div></section>
    </aside>

    <section class="card mapwrap" id="mapwrap">
      <div class="maphead">
        <p>자치구 또는 번호를 클릭하면 해당 프로젝트가 열립니다 · 번호는 표의 No.와 동일</p>
        <div class="legend">
          <span><i style="background:#F2A0B6"></i>검토 있음</span>
          <span><i style="background:#E9ECF2"></i>검토 없음</span>
        </div>
      </div>
      <svg class="map" id="map" role="img" aria-label="서울 자치구별 프로젝트 지도"></svg>
      <div class="pop" id="pop" role="dialog" aria-live="polite"></div>
    </section>
  </div>

  <div id="backdrop"></div>

  <details class="all card">
    <summary>전체 프로젝트 41건 표로 보기</summary>
    <div style="overflow:auto"><table id="tbl">
      <thead><tr><th>No</th><th>지역</th><th>시기</th><th>프로젝트명</th><th>운영방식</th><th>결과</th></tr></thead><tbody></tbody>
    </table></div>
  </details>
  <footer>서울 외 프로젝트는 지도 번호를 부여하지 않음 · 인구 2026.04 · 세대 2022.05 · 아파트 단가 2026.05 국토교통부 실거래가 · 사업개발팀</footer>
</div>

const tagCls=r=>r==="Drop"?"t-drop":r==="진행중"?"t-go":r==="지속적 경과확인"?"t-watch":r==="MOU 체결"?"t-mou":"t-none";
let active=null, filter="전체";
const match=p=>filter==="전체"||(filter==="미정"?!p.res:p.res===filter);
function rowsHTML(list){
  const on=list.filter(match);
  if(!on.length) return '<div style="padding:22px 15px;font-size:12.5px;color:#8B94AA;font-weight:600">선택한 결과 조건에 해당하는 프로젝트가 없습니다.</div>';
  return on.map(p=>'<div class="row" data-no="'+(p.no||"")+'"><span class="no'+(p.no?"":" x")+'">'+(p.no??"–")+'</span>'+
    '<span class="tt">'+p.name+'</span><span class="tag '+tagCls(p.res)+'">'+(p.res||"미정")+'</span>'+
    '<span class="meta">'+p.date+" · "+(p.op==="-"?"운영방식 미정":p.op)+'</span></div>').join("");
}
function screenPt(x,y){
  const r=wrapEl.getBoundingClientRect(), sr=svg.getBoundingClientRect();
  try{
    const pt=svg.createSVGPoint(); pt.x=x; pt.y=y;
    const m=pt.matrixTransform(svg.getScreenCTM());
    if(m) return {x:m.x-r.left,y:m.y-r.top};
  }catch(e){}
  return {x:sr.left-r.left+sr.width*x/GEO.w, y:sr.top-r.top+sr.height*y/GEO.h};
}
function place(anchor){
  if(isMobile()){ pop.style.left=""; pop.style.top=""; return; }
  const r=wrapEl.getBoundingClientRect(), w=pop.offsetWidth, h=pop.offsetHeight;
  let top=anchor.y+30; if(top+h>r.height-8) top=Math.max(8,anchor.y-h-30);
  pop.style.left=Math.max(10,Math.min(anchor.x-w/2,r.width-w-10))+"px";
  pop.style.top=top+"px";
}
function showPop(title,sub,color,list,anchor,focusNo){
  const drop=list.filter(p=>p.res==="Drop").length, go=list.filter(p=>p.res==="진행중").length;
  const st=STATS[title];
  let stats="", srcline="";
  if(st){
    const [pop_,hh,area,pyeong,m2]=st;
    stats='<dl class="pop-stats">'+
      '<div><dt>인구</dt><dd>'+(pop_/10000).toFixed(1)+'<small>만명</small></dd></div>'+
      '<div><dt>세대수</dt><dd>'+nf(hh)+'<small>세대</small></dd></div>'+
      '<div><dt>아파트 평당가</dt><dd>'+nf(pyeong)+'<small>만원</small></dd></div>'+
      '<div><dt>84㎡ 환산</dt><dd>'+(m2*84/10000).toFixed(1)+'<small>억원</small></dd></div>'+
      '<div><dt>인구밀도</dt><dd>'+nf(Math.round(pop_/area))+'<small>명/㎢</small></dd></div>'+
      '<div><dt>면적</dt><dd>'+area.toFixed(2)+'<small>㎢</small></dd></div>'+
      '</dl>';
    srcline='<span>인구 26.04 · 세대 22.05 · 아파트 26.05 국토부 실거래가</span>';
  }
  pop.innerHTML='<div class="sheet-grip"></div><div class="pop-h"><span class="sw" style="background:'+color+'"></span>'+
    '<div><h3>'+title+'</h3><p>'+sub+'</p></div><button aria-label="닫기" id="popx">✕</button></div>'+
    stats+
    '<div class="pop-b">'+rowsHTML(list)+'</div>'+
    '<div class="pop-f"><span>진행중 '+go+'건</span><span>Drop '+drop+'건</span><span>전체 '+list.length+'건</span>'+srcline+'</div>';
  document.getElementById("popx").onclick=clearSel;
  pop.classList.add("show"); backdrop.classList.add("show"); place(anchor);
  if(focusNo){const r=pop.querySelector('.row[data-no="'+focusNo+'"]');
    if(r){r.classList.add("hl");r.scrollIntoView({block:"nearest"});setTimeout(()=>r.classList.remove("hl"),1600);}}
}
function select(name,focusNo){
  if(active===name&&!focusNo){clearSel();return;}
  clearSel();
  const c=cells[name]; active=name;
  const cx=c.g.lx, cy=c.g.ly;
  const tf="translate(0px,-14px) translate("+cx+"px,"+cy+"px) scale(1.07) translate("+(-cx)+"px,"+(-cy)+"px)";
  c.nodes.forEach(n=>{n.classList.add("on");topLayer.appendChild(n);});
  c.lifts.forEach(l=>l.style.transform=tf);
  showPop(name, c.list.length?"검토 "+c.list.length+"건":"2026년 검토 이력 없음", c.color, c.list, screenPt(cx,cy), focusNo);
}
function clearSel(){
  if(active){const c=cells[active];c.nodes.forEach(n=>n.classList.remove("on"));c.lifts.forEach(l=>l.style.transform="");
    gShapes.appendChild(c.sNode); gMarks.appendChild(c.mNode);}
  active=null; pop.classList.remove("show"); backdrop.classList.remove("show");
}
svg.addEventListener("click",e=>{if(!e.target.closest(".cell"))clearSel();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")clearSel();});
let lastMode=isMobile();
window.addEventListener("resize",()=>{
  if(isMobile()!==lastMode){ lastMode=isMobile(); applyMode(); }
  if(active) place(screenPt(cells[active].g.lx,cells[active].g.ly));
});
applyMode();

/* 필터 */
const RES=["전체","진행중","지속적 경과확인","MOU 체결","Drop","미정"];
const chips=document.getElementById("chips");
RES.forEach(r=>{
  const n=P.filter(p=>r==="전체"?1:(r==="미정"?!p.res:p.res===r)).length;
  const b=document.createElement("button");
  b.className="chip"; b.setAttribute("aria-pressed",r==="전체"); b.innerHTML=r+"<i>"+n+"</i>";
  b.onclick=()=>{filter=r;[...chips.children].forEach(c=>c.setAttribute("aria-pressed",c===b));applyFilter();};
  chips.appendChild(b);
});
function applyFilter(){
  Object.keys(cells).forEach(k=>{
    const c=cells[k];
    const off = filter!=="전체" && !c.list.some(match);
    c.nodes.forEach(n=>n.classList.toggle("dim",off));
    c.mNode.querySelectorAll(".pin").forEach(pin=>{
      const p=c.list.find(x=>String(x.no)===pin.getAttribute("data-no"));
      pin.classList.toggle("mute", filter!=="전체" && p && !match(p));
    });
  });
  if(active){const c=cells[active];
    showPop(active,c.list.length?"검토 "+c.list.length+"건":"2026년 검토 이력 없음",c.color,c.list,screenPt(c.g.lx,c.g.ly));}
  buildRank();
}

/* 랭킹 */
const rank=document.getElementById("rank");
function buildRank(){
  rank.innerHTML="";
  const rows=Object.keys(byGu).filter(k=>byGu[k].length)
    .map(k=>({name:k,n:byGu[k].filter(match).length,tot:byGu[k].length,color:COLOR[k]||GRAY}))
    .sort((a,b)=>b.tot-a.tot);
  const max=Math.max(...rows.map(r=>r.tot));
  rows.forEach(r=>{
    const b=document.createElement("button");
    b.innerHTML='<span class="dot" style="background:'+r.color+'"></span><span class="nm">'+r.name+'</span>'+
      '<span class="bar"><i style="width:'+(r.n/max*100).toFixed(0)+'%;background:'+r.color+'"></i></span><span class="ct">'+r.n+'</span>';
    b.onclick=()=>{select(r.name);svg.scrollIntoView({behavior:"smooth",block:"center"});};
    rank.appendChild(b);
  });
}
buildRank();

/* 서울 외 */
const out=document.getElementById("outside");
P.filter(p=>!p.gu).forEach(p=>{
  const b=document.createElement("button");
  b.innerHTML='<span class="rg">'+p.region+'</span><span class="pj">'+p.name+'</span><span class="tag '+tagCls(p.res)+'">'+(p.res||"미정")+'</span>';
  b.onclick=()=>{clearSel();const r=wrapEl.getBoundingClientRect();
    showPop(p.region,"서울 외 프로젝트","#C3CAD8",[p],{x:r.width/2,y:r.height/2-150});};
  out.appendChild(b);
});

/* 전체 표 */
const tb=document.querySelector("#tbl tbody");
P.forEach(p=>{
  const tr=document.createElement("tr");
  tr.innerHTML='<td class="n">'+(p.no??"–")+'</td><td>'+p.region+'</td><td class="d">'+p.date+'</td>'+
    '<td class="p">'+p.name+'</td><td class="d">'+p.op+'</td><td><span class="tag '+tagCls(p.res)+'">'+(p.res||"미정")+'</span></td>';
  tb.appendChild(tr);
});
</script>
</body>
</html>
