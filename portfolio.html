<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파르나스 호텔 자산 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#0E0E10;
    --bg-grad:#141416;
    --panel:#161719;
    --surface:#1C1D20;
    --surface-2:#232427;
    --line:#2C2D31;
    --line-soft:#222327;
    --gold:#E3A63C;
    --gold-bright:#F2C266;
    --gold-dim:#8A6C2E;
    --growth:#C4C8D0;
    --ink:#EDEDEE;
    --ink-soft:#9A9AA0;
    --ink-faint:#66666C;
    --pos:#5FBE8C;
    --neg:#E4674B;
    --pos-bg:rgba(95,190,140,.13);
    --neg-bg:rgba(228,103,75,.14);
    --gold-bg:rgba(227,166,60,.13);
    --sans:'Pretendard','Noto Sans KR',system-ui,-apple-system,sans-serif;
    --disp:'Pretendard','Noto Sans KR',sans-serif;
    --mono:'Pretendard','Noto Sans KR',sans-serif;
    --shadow:0 2px 4px rgba(0,0,0,.4),0 24px 60px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans);color:var(--ink);line-height:1.56;letter-spacing:-.01em;
    background:
      radial-gradient(1100px 560px at 82% -10%,rgba(227,166,60,.05),transparent 58%),
      radial-gradient(800px 460px at 0% 6%,rgba(227,166,60,.025),transparent 55%),
      var(--bg);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .na{color:var(--ink-faint);font-weight:400}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- masthead ---------- */
  .masthead{max-width:1300px;margin:0 auto;padding:40px 34px 0}
  .brandline{
    display:flex;align-items:center;gap:11px;font-family:var(--mono);font-size:11px;
    letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:500;
  }
  .brandline .dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}
  .brandline .thin{color:var(--ink-faint)}
  .title-row{
    display:flex;align-items:flex-end;justify-content:space-between;gap:26px;flex-wrap:wrap;
    margin-top:15px;padding-bottom:26px;border-bottom:1px solid var(--line);
  }
  h1{font-weight:900;font-size:clamp(28px,4.4vw,47px);line-height:1.02;letter-spacing:-.03em}
  h1 em{font-family:inherit;font-style:normal;font-weight:inherit;color:inherit;letter-spacing:inherit}
  .summary{display:flex;gap:28px;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;gap:3px;min-width:62px}
  .stat b{font-family:var(--disp);font-weight:500;font-size:32px;line-height:1;letter-spacing:-.02em;color:var(--ink)}
  .stat b .u{font-size:15px;color:var(--ink-soft);margin-left:1px;font-family:var(--sans);font-weight:600}
  .stat span{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft)}

  /* ---------- tabs ---------- */
  .tabs{max-width:1300px;margin:22px auto 0;padding:0 34px;display:flex;gap:2px}
  .tab{
    font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink-soft);
    background:none;border:none;cursor:pointer;padding:11px 18px;border-radius:9px 9px 0 0;
    position:relative;transition:color .18s,background .18s;letter-spacing:-.01em;
  }
  .tab .en{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-faint);margin-right:8px}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--ink);background:var(--panel)}
  .tab[aria-selected="true"] .en{color:var(--gold)}
  .tab[aria-selected="true"]::after{content:"";position:absolute;left:18px;right:18px;bottom:-1px;height:2px;background:var(--gold)}

  .board{max-width:1300px;margin:0 auto;padding:0 34px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:0 15px 15px 15px;box-shadow:var(--shadow);overflow:hidden}
  .workspace{display:grid;grid-template-columns:322px 1fr}

  /* ---------- ledger ---------- */
  .ledger{border-right:1px solid var(--line);padding:8px;background:linear-gradient(180deg,rgba(227,166,60,.04),transparent 140px)}
  .lg-group{padding:15px 12px 6px}
  .lg-group-t{display:flex;align-items:baseline;gap:8px}
  .lg-group-t b{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.02em}
  .lg-group-t span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
  .lg-group-sub{font-size:11px;color:var(--ink-faint);margin-top:2px}
  .lg-item{
    width:100%;text-align:left;background:none;border:1px solid transparent;cursor:pointer;
    display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;
    padding:11px 12px;border-radius:11px;font-family:var(--sans);transition:background .16s,border-color .16s;color:var(--ink);
  }
  .lg-item:hover{background:var(--surface)}
  .lg-item[aria-current="true"]{background:var(--surface-2);border-color:var(--gold-dim);box-shadow:inset 3px 0 0 var(--gold)}
  .lg-item[aria-current="true"] .lg-idx{color:var(--gold)}
  .lg-item[aria-current="true"] .lg-name{color:var(--ink)}
  .lg-idx{font-family:var(--disp);font-size:17px;font-weight:700;color:var(--ink-faint);text-align:center}
  .lg-name{font-size:15px;font-weight:700;letter-spacing:-.02em}
  .lg-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;display:block}
  .lg-rooms{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink-soft);white-space:nowrap}

  /* ---------- tearsheet ---------- */
  .sheet{padding:36px 40px 44px;min-height:640px}
  .sheet-anim{animation:rise .42s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .sh-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .sh-index{font-family:var(--disp);font-size:15px;color:var(--gold);font-weight:500;letter-spacing:.02em}
  .badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:100px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.run{color:var(--gold);background:var(--gold-bg)}
  .badge.build{color:var(--neg);background:var(--neg-bg)}
  .chip{font-size:12.5px;color:var(--ink-soft);border:1px solid var(--line);padding:4px 11px;border-radius:100px;font-weight:500}
  .sh-name{font-size:clamp(32px,4.8vw,50px);font-weight:900;letter-spacing:-.035em;line-height:1.02;margin-top:17px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .site-link{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;color:var(--gold);transition:.16s;flex:none;background:var(--surface)}
  .site-link:hover{background:var(--gold-bg);border-color:var(--gold);color:var(--gold-bright);transform:translateY(-1px)}
  .site-link svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
  .site-link.sm{width:22px;height:22px;border-radius:6px;margin-left:7px;vertical-align:middle}
  .site-link.sm svg{width:13px;height:13px;stroke-width:1.8}
  .sh-loc{font-family:var(--mono);font-size:13px;color:var(--ink-soft);margin-top:12px;display:flex;align-items:center;gap:8px}
  .sh-loc .pin{color:var(--gold)}

  .rail{display:grid;grid-template-columns:repeat(4,1fr);margin-top:28px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--surface)}
  .rail-c{padding:15px 18px;border-right:1px solid var(--line-soft)}
  .rail-c:last-child{border-right:none}
  .rail-c .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
  .rail-c .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1.05;color:var(--ink)}
  .rail-c .v small{font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-left:3px}

  /* ---------- performance card ---------- */
  .perf{margin-top:24px;border:1px solid var(--line);border-radius:14px;padding:22px 24px 20px;background:var(--surface)}
  .perf .sec-head .en{color:var(--gold-dim)}
  .perf-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:20px}
  .kpi{background:var(--panel);padding:13px 15px}
  .kpi .kk{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  .kpi .kv{font-size:18.5px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1;color:var(--ink)}
  .kpi .kv small{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-left:1px}
  .kpi .kd{font-family:var(--mono);font-size:11px;font-weight:600;margin-top:7px;display:flex;align-items:center;gap:3px}
  .kd.up{color:var(--pos)} .kd.down{color:var(--neg)} .kd.flat{color:var(--ink-faint)}

  .metric-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .mt{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--panel);border:1px solid var(--line);padding:6px 14px;border-radius:100px;cursor:pointer;transition:.15s}
  .mt:hover{border-color:var(--gold-dim);color:var(--ink)}
  .mt[aria-pressed="true"]{background:var(--gold);color:#1a1509;border-color:var(--gold)}

  .chart-wrap{border:1px solid var(--line);border-radius:11px;padding:8px 10px 4px;background:var(--panel)}
  .chart{width:100%;height:auto;display:block}
  .ch-zero{stroke:var(--line);stroke-width:1}
  .ch-gzero{stroke:var(--growth);stroke-width:1;stroke-dasharray:2 3;opacity:.45}
  .ch-bar{fill:var(--gold-dim);transition:fill .3s}
  .ch-bar.last{fill:var(--gold)}
  .ch-bar.neg{fill:#5a3a34}
  .ch-bar.neg.last{fill:var(--neg)}
  .ch-val{fill:var(--ink-soft);font-family:var(--mono);font-size:12px;text-anchor:middle;font-weight:600}
  .ch-val.hl{fill:var(--gold-bright)}
  .ch-yr{fill:var(--ink-soft);font-family:var(--mono);font-size:12px;text-anchor:middle}
  .ch-line{fill:none;stroke:var(--growth);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
  .ch-dot{fill:var(--growth);stroke:var(--panel);stroke-width:1.5}
  .ch-lval{fill:var(--growth);font-family:var(--mono);font-size:11px;text-anchor:middle;font-weight:600}
  .ch-cagr{stroke:var(--gold-bright);stroke-width:1.6;stroke-dasharray:6 4;opacity:1}
  .ch-cagrtag{fill:var(--gold-bright);font-family:var(--mono);font-size:11px;font-weight:600}
  .ch-axlbl{fill:var(--ink-faint);font-family:var(--mono);font-size:10px}
  .ch-legend{display:flex;gap:18px;flex-wrap:wrap;padding:10px 6px 3px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
  .ch-legend .lg-k{display:flex;align-items:center;gap:7px}
  .lg-k::before{content:"";display:inline-block}
  .lg-bar::before{width:11px;height:11px;background:var(--gold);border-radius:2px}
  .lg-line::before{width:17px;border-top:2px solid var(--growth)}
  .lg-cagr{color:var(--gold-bright)}
  .lg-cagr::before{width:17px;border-top:2px dashed var(--gold-bright)}

  .perf-table{margin-top:16px;overflow-x:auto}
  .perf-table table{border-collapse:collapse;width:100%;min-width:520px;font-size:12.5px}
  .perf-table th{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);
    text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:600}
  .perf-table th:first-child{text-align:left}
  .perf-table td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500;font-size:13px}
  .perf-table td:first-child{text-align:left;font-family:var(--disp);font-size:15px;color:var(--gold);font-weight:500}
  .perf-table tr:last-child td{border-bottom:none}
  .perf-table tr.cur td{background:var(--gold-bg)}
  .perf-table td.neg{color:var(--neg)}
  .perf-note{font-size:11px;color:var(--ink-faint);margin-top:12px;font-family:var(--mono);letter-spacing:.02em;line-height:1.5}

  .noperf{margin-top:24px;border:1px dashed var(--line);border-radius:12px;padding:22px 24px;color:var(--ink-soft);font-size:13.5px;background:var(--surface)}
  .noperf b{color:var(--ink);font-weight:700}

  /* ---------- info grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
  .card{border:1px solid var(--line);border-radius:13px;padding:20px 22px 8px;background:var(--surface)}
  .card.wide{grid-column:1 / -1}
  .sec-head{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}
  .sec-head .en{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dim);font-weight:600}
  .sec-head .ko{font-size:14px;font-weight:700;color:var(--ink)}
  .sec-head::after{content:"";flex:1;height:1px;background:var(--line-soft);align-self:center}

  .row{display:grid;grid-template-columns:122px 1fr;gap:16px;padding:11px 0;border-top:1px solid var(--line-soft);align-items:start}
  .row:first-of-type{border-top:none}
  .row .k{font-size:13.5px;color:var(--ink-soft);font-weight:500;padding-top:1px}
  .row .val{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  .val .v-main{display:block}
  .val .v-title{display:block;font-weight:700;color:var(--gold);font-size:13.5px;margin-bottom:5px}
  .val .v-note{display:block;font-size:13px;font-weight:400;color:var(--ink-soft);margin-top:3px}
  .val .v-items{list-style:none;display:flex;flex-direction:column;gap:5px}
  .val .v-items li{font-size:13.5px;font-weight:500;color:var(--ink);padding-left:13px;position:relative}
  .val .v-items li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--gold-dim)}
  .pm-co{font-family:var(--mono);font-size:12.5px;color:var(--gold);letter-spacing:.02em}
  .pm-person{font-size:14.5px;font-weight:600;margin-top:2px}

  /* ---------- compare ---------- */
  .compare{padding:6px}
  .cmp-scroll{overflow-x:auto}
  table.cmp{border-collapse:collapse;width:100%;min-width:960px;font-size:12.5px}
  .cmp thead th{position:sticky;top:0;background:var(--panel);z-index:2;text-align:left;padding:15px 14px;border-bottom:1px solid var(--line);font-weight:800;letter-spacing:-.02em;vertical-align:bottom}
  .cmp thead th .grp{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dim);font-weight:600;margin-bottom:5px}
  .cmp th.rowhead,.cmp td.rowhead{position:sticky;left:0;background:var(--surface);z-index:1;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;white-space:nowrap;border-right:1px solid var(--line)}
  .cmp thead th.rowhead{z-index:3;background:var(--panel)}
  .cmp tbody td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;font-weight:500;color:var(--ink);font-size:13px}
  .cmp tbody tr:hover td{background:var(--surface)}
  .cmp tbody tr.divide td{border-top:1px solid var(--line)}
  .cmp td .sub{display:block;font-size:11.5px;color:var(--ink-faint);font-weight:400;margin-top:2px}
  .cmp td.fig{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .cmp-name{font-size:14.5px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}

  .hidden{display:none}
  .foot{max-width:1300px;margin:0 auto;padding:0 34px 44px;font-size:11.5px;color:var(--ink-faint);display:flex;gap:8px;flex-wrap:wrap}
  .foot .m{font-family:var(--mono);letter-spacing:.04em;color:var(--gold-dim)}

  @media(max-width:960px){
    .workspace{grid-template-columns:1fr}
    .ledger{border-right:none;border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:12px;scroll-snap-type:x mandatory}
    .lg-group{display:contents}
    .lg-group-t,.lg-group-sub{display:none}
    .lg-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:160px;scroll-snap-align:start;grid-template-columns:none;border:1px solid var(--line)}
    .lg-idx{display:none}
    .lg-rooms{margin-top:4px}
    .sheet{padding:26px 20px 34px}
    .grid{grid-template-columns:1fr}
    .rail,.perf-kpis{grid-template-columns:1fr 1fr}
  }
  @media(max-width:560px){
    .masthead{padding:28px 18px 0}.tabs{padding:0 18px}.board{padding:0 18px 40px}.foot{padding:0 18px 40px}
    .summary{gap:18px}.stat b{font-size:25px}
    .perf-kpis{grid-template-columns:1fr 1fr}
  }
  @media(prefers-reduced-motion:reduce){.sheet-anim{animation:none}*{transition:none!important}}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
  ::selection{background:rgba(212,175,87,.3)}
</style>
</head>
<body>

<header class="masthead">
  <div class="brandline"><span class="dot"></span>PARNAS HOTEL<span class="thin">·</span><span class="thin">ASSET PORTFOLIO</span></div>
  <div class="title-row">
    <h1>주요 호텔 운영 및 <em>개발 현황</em></h1>
    <div class="summary">
      <div class="stat"><b>8</b><span>Assets</span></div>
      <div class="stat"><b>2,361</b><span>Total Rooms</span></div>
      <div class="stat"><b id="stat-rev">—</b><span>2025 매출 (6개)</span></div>
      <div class="stat"><b>7<span class="u">/1</span></b><span>운영 / 개발</span></div>
    </div>
  </div>
</header>

<div class="tabs" role="tablist" aria-label="보기 전환">
  <button class="tab" role="tab" id="tab-detail" aria-selected="true" aria-controls="view-detail"><span class="en">01</span>자산별 상세</button>
  <button class="tab" role="tab" id="tab-compare" aria-selected="false" aria-controls="view-compare"><span class="en">02</span>포트폴리오 비교</button>
</div>

<main class="board">
  <section class="panel" id="view-detail" role="tabpanel" aria-labelledby="tab-detail">
    <div class="workspace">
      <nav class="ledger" id="ledger" role="listbox" aria-label="자산 선택" tabindex="0"></nav>
      <div class="sheet" id="sheet"></div>
    </div>
  </section>
  <section class="panel compare hidden" id="view-compare" role="tabpanel" aria-labelledby="tab-compare" hidden>
    <div class="cmp-scroll"><table class="cmp" id="cmp-table"></table></div>
  </section>
</main>

<script>
/* ===== 연도별 실적 합계 (원 단위) — 2025.12 연결 ===== */

/* ---------- chart ---------- */
function fmtBar(v,m){
 if(v==null)return"";
 if(m==="rev"||m==="op")return (v/1e8).toFixed(Math.abs(v/1e8)<10?1:0)+"억";
 if(m==="adr"||m==="revpar")return (v/1e4).toFixed(0)+"만";
 if(m==="occ")return v.toFixed(0)+"%";
 return v;
}
// 전년비 성장률(YoY) + CAGR — 직전값이 0 이하이거나 부호가 바뀌면 산출 불가(null)
function growth(series,m){
 const v=series.map(s=>s[m]);
 const yoy=v.map((cur,i)=>{
  if(i===0)return null;const p=v[i-1];
  if(p==null||cur==null||p<=0)return null;
  return (cur/p-1)*100;
 });
 const f=v[0],l=v[v.length-1];
 let cagr=null;
 if(f!=null&&l!=null&&f>0&&l>0&&v.length>1)cagr=(Math.pow(l/f,1/(v.length-1))-1)*100;
 return {yoy,cagr};
}
function chart(series,m){
 const n=series.length,W=760,H=266,padB=32,padT=32,padL=10,padR=76;
 const vals=series.map(s=>s[m]==null?0:s[m]);
 let max=Math.max(...vals,0),min=Math.min(...vals,0);
 if(max===0&&min===0)max=1;const range=(max-min)||1;
 const plotH=H-padT-padB,zeroY=padT+(max/range)*plotH,step=(W-padL-padR)/n,bw=Math.min(step*0.5,54);
 // 막대 (좌축)
 let bars=`<line x1="${padL}" x2="${W-padR}" y1="${zeroY.toFixed(1)}" y2="${zeroY.toFixed(1)}" class="ch-zero"/>`;
 series.forEach((d,i)=>{
  const cx=padL+step*i+step/2,v=d[m]==null?0:d[m],h=Math.abs(v)/range*plotH;
  const y=v>=0?zeroY-h:zeroY,neg=v<0,last=i===n-1;
  bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="3" class="ch-bar ${neg?'neg':''} ${last?'last':''}"/>`;
  const ly=v>=0?y-8:y+h+15;bars+=`<text x="${cx.toFixed(1)}" y="${ly.toFixed(1)}" class="ch-val ${last?'hl':''}">${fmtBar(v,m)}</text>`;
  bars+=`<text x="${cx.toFixed(1)}" y="${H-9}" class="ch-yr">'${String(d.y).slice(2)}</text>`;
 });
 // 성장률 라인 + CAGR (우축)
 const g=growth(series,m);
 const valid=g.yoy.filter(x=>x!=null);
 const pts=valid.slice();if(g.cagr!=null)pts.push(g.cagr);
 const cagrTxt=g.cagr!=null?(g.cagr>=0?"+":"")+g.cagr.toFixed(1)+"%":"산출 불가";
 let sec="";
 if(pts.length){
  const realMin=Math.min(...pts),realMax=Math.max(...pts);
  let sMin=Math.min(realMin,0),sMax=Math.max(realMax,0);
  const pd=((sMax-sMin)||1)*0.2;sMin-=pd;sMax+=pd;
  const mapY=val=>(H-padB)-(val-sMin)/(sMax-sMin)*(H-padB-padT);
  // 0% 기준선은 실제 하락(음수 성장)이 있을 때만 표시
  if(realMin<-0.5){const zy=mapY(0);sec+=`<line x1="${padL}" x2="${W-padR}" y1="${zy.toFixed(1)}" y2="${zy.toFixed(1)}" class="ch-gzero"/><text x="${(W-padR+6)}" y="${(zy+3.5).toFixed(1)}" class="ch-axlbl">0%</text>`;}
  // CAGR 점선 + 값 태그(우측)
  if(g.cagr!=null){const cy=mapY(g.cagr);
   sec+=`<line x1="${padL}" x2="${W-padR}" y1="${cy.toFixed(1)}" y2="${cy.toFixed(1)}" class="ch-cagr"/>`;
   sec+=`<text x="${(W-6)}" y="${(cy+4).toFixed(1)}" text-anchor="end" class="ch-cagrtag">CAGR ${cagrTxt}</text>`;
  }
  // 전년비 성장률 라인
  let dpath="",started=false;
  g.yoy.forEach((val,i)=>{
   if(val==null){started=false;return;}
   const cx=padL+step*i+step/2,cy=mapY(val);
   dpath+=(started?" L":"M")+cx.toFixed(1)+" "+cy.toFixed(1);started=true;
  });
  if(dpath)sec+=`<path d="${dpath}" class="ch-line"/>`;
  const fmtPct=v=>(v>=0?"+":"")+(Math.abs(v)<10?v.toFixed(1):v.toFixed(0))+"%";
  g.yoy.forEach((val,i)=>{
   if(val==null)return;
   const cx=padL+step*i+step/2,cy=mapY(val);
   sec+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3" class="ch-dot"/>`;
   const ly=cy<padT+18?cy+16:cy-9;
   sec+=`<text x="${cx.toFixed(1)}" y="${ly.toFixed(1)}" class="ch-lval">${fmtPct(val)}</text>`;
  });
 }
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet" role="img" aria-label="연도별 ${m} 값 및 성장률 차트">${bars}${sec}</svg>
 <div class="ch-legend"><span class="lg-k lg-bar">값 (좌축)</span><span class="lg-k lg-line">전년비 성장률 (우축)</span><span class="lg-k lg-cagr">전체 CAGR ${cagrTxt}</span></div>`;
}

/* ---------- performance block ---------- */
function deltaHTML(cur,prev,type){
 if(prev==null||cur==null)return '<span class="kd flat">—</span>';
 let d,txt,cls;
 if(type==="pp"){d=cur-prev;txt=(d>=0?"▲":"▼")+" "+Math.abs(d).toFixed(1)+"p";}
 else if(type==="op"){d=cur-prev;txt=(d>=0?"▲":"▼")+" "+won(Math.abs(d));}
 else{d=(cur-prev)/Math.abs(prev)*100;txt=(d>=0?"▲":"▼")+" "+Math.abs(d).toFixed(1)+"%";}
 cls=d>0?"up":d<0?"down":"flat";
 return `<span class="kd ${cls}">${txt}</span>`;
}
function perfBlock(id){
 const P=PERF[id];if(!P)return "";
 const cur=P[P.length-1],prev=P.length>1?P[P.length-2]:null,yr=cur.y;
 const kpis=[
  {kk:`매출액 '${String(yr).slice(2)}`,kv:won(cur.rev),d:deltaHTML(cur.rev,prev&&prev.rev,"pct")},
  {kk:"영업이익",kv:won(cur.op),neg:cur.op<0,d:deltaHTML(cur.op,prev&&prev.op,"op")},
  {kk:"ADR",kv:wonPlain(cur.adr),d:deltaHTML(cur.adr,prev&&prev.adr,"pct")},
  {kk:"점유율",kv:pct(cur.occ),d:deltaHTML(cur.occ,prev&&prev.occ,"pp")},
  {kk:"RevPAR",kv:wonPlain(cur.revpar),d:deltaHTML(cur.revpar,prev&&prev.revpar,"pct")}
 ];
 const khtml=kpis.map(k=>`<div class="kpi"><div class="kk">${esc(k.kk)}</div><div class="kv" ${k.neg?'style="color:var(--neg)"':''}>${k.kv}</div>${k.d}</div>`).join("");
 const mt=METRICS.map(mm=>`<button class="mt" data-metric="${mm.k}" aria-pressed="${mm.k===currentMetric}">${mm.label}</button>`).join("");
 let rows="";
 P.forEach((d,i)=>{
  const cls=i===P.length-1?"cur":"";
  rows+=`<tr class="${cls}"><td>'${String(d.y).slice(2)}</td>
   <td>${won(d.rev)}</td><td>${won(d.room)}</td>
   <td class="${d.op<0?'neg':''}">${won(d.op)}</td>
   <td>${wonPlain(d.adr)}</td><td>${pct(d.occ)}</td><td>${wonPlain(d.revpar)}</td></tr>`;
 });
 return `<div class="card wide perf">
  <div class="sec-head"><span class="en">Performance</span><span class="ko">연도별 실적 (실적 합계)</span></div>
  <div class="perf-kpis">${khtml}</div>
  <div class="metric-tabs" id="metric-tabs">${mt}</div>
  <div class="chart-wrap" id="chart-wrap">${chart(P,currentMetric)}</div>
  <div class="perf-table"><table>
   <thead><tr><th>연도</th><th>매출액</th><th>객실매출</th><th>영업이익</th><th>ADR</th><th>점유율</th><th>RevPAR</th></tr></thead>
   <tbody>${rows}</tbody></table></div>
  <div class="perf-note">단위 · 매출/이익 억원 · ADR/RevPAR 원 · 점유율 % ｜ 각 연도 실적 합계 · 출처 2025.12 연결</div>
 </div>`;
}

/* ---------- tearsheet ---------- */
const sheet=document.getElementById("sheet");
let current=0,currentMetric="rev";
function pmVal(pm){return pm?`<span class="pm-co">${esc(pm.co)}</span><span class="pm-person">${esc(pm.person)}</span>`:'<span class="na">해당 없음</span>';}
function rowH(k,v){return `<div class="row"><div class="k">${k}</div><div class="val">${v}</div></div>`;}

function render(i){
 const a=ASSETS[i],g=GROUPS[a.group],st=STATUS[a.status],idx=String(i+1).padStart(2,"0");
 const perf=PERF[a.id]?perfBlock(a.id):
   `<div class="noperf"><b>운영 실적 데이터 없음</b> — ${g.label} 자산으로 연결 손익 시트 미포함 항목입니다.</div>`;
 sheet.innerHTML=`
  <div class="sh-top">
   <span class="sh-index">${idx} / 08</span>
   <span class="badge ${st.cls}">${st.txt}</span>
   <span class="chip">${g.label}</span><span class="chip">${a.grade}</span>
  </div>
  <div class="sh-name"><span>${esc(a.name)}</span>${siteLink(a)}</div>
  <div class="sh-loc"><span class="pin">◈</span>${esc(a.location)}</div>
  <div class="rail">
   <div class="rail-c"><div class="k">Grade 등급</div><div class="v">${esc(a.grade)}</div></div>
   <div class="rail-c"><div class="k">Rooms 객실수</div><div class="v">${a.rooms}<small>실</small></div></div>
   <div class="rail-c"><div class="k">Open 오픈</div><div class="v">${esc(txt(a.open))}</div></div>
   <div class="rail-c"><div class="k">Investment 총 투자</div><div class="v">${esc(txt(a.purchase))}</div></div>
  </div>
  ${perf}
  <div class="grid">
   <div class="card">
    <div class="sec-head"><span class="en">Scale</span><span class="ko">규모</span></div>
    ${rowH("대지면적",val(a.landArea))}${rowH("연면적",val(a.floorArea))}${rowH("층수",val(a.floors))}${rowH("객실 크기",val(a.roomSize))}
   </div>
   <div class="card">
    <div class="sec-head"><span class="en">Contract</span><span class="ko">계약 조건</span></div>
    ${rowH("계약기간",val(a.contractPeriod))}${rowH("수수료율",val(a.commission))}${rowH("최소보장금",val(a.minGuarantee))}${rowH("보증금",val(a.deposit))}
   </div>
   <div class="card wide">
    <div class="sec-head"><span class="en">Finance</span><span class="ko">투자 · 금융</span></div>
    ${rowH("매입가 (총 투자)",val(a.purchase))}${rowH("Loan (금리)",val(a.loan))}
   </div>
  </div>`;
 sheet.classList.remove("sheet-anim");void sheet.offsetWidth;sheet.classList.add("sheet-anim");
 bindMetricTabs();
}
function bindMetricTabs(){
 const tabs=document.getElementById("metric-tabs");if(!tabs)return;
 tabs.querySelectorAll(".mt").forEach(b=>b.addEventListener("click",()=>{
  currentMetric=b.dataset.metric;
  tabs.querySelectorAll(".mt").forEach(x=>x.setAttribute("aria-pressed",x===b));
  document.getElementById("chart-wrap").innerHTML=chart(PERF[ASSETS[current].id],currentMetric);
 }));
}
function select(i){current=i;
 ledger.querySelectorAll(".lg-item").forEach(b=>{const on=+b.dataset.i===i;b.setAttribute("aria-current",on);b.setAttribute("aria-selected",on);});
 render(i);
}
ledger.addEventListener("click",e=>{const b=e.target.closest(".lg-item");if(b)select(+b.dataset.i);});
ledger.addEventListener("keydown",e=>{
 if(["ArrowDown","ArrowRight"].includes(e.key)){e.preventDefault();select((current+1)%ASSETS.length);scrollInto();}
 if(["ArrowUp","ArrowLeft"].includes(e.key)){e.preventDefault();select((current-1+ASSETS.length)%ASSETS.length);scrollInto();}
});
function scrollInto(){const el=ledger.querySelector(`.lg-item[data-i="${current}"]`);if(el)el.scrollIntoView({block:"nearest",inline:"nearest",behavior:"smooth"});}

/* ---------- compare ---------- */
(function(){
 const lastP=id=>{const P=PERF[id];return P?P[P.length-1]:null;};
 const rows=[
  ["운영형태",a=>GROUPS[a.group].label,0],
  ["등급",a=>a.grade,0],["오픈",a=>cell(a.open),0],
  ["객실수",a=>`<span class="fig">${a.rooms}</span>실`,0],
  ["대지면적",a=>a.landArea,0],["연면적",a=>cell(a.floorArea),0],
  ["계약기간",a=>cell(a.contractPeriod),0],
  ["수수료율",a=>cellCom(a.commission),0],
  ["최소보장금",a=>cell(a.minGuarantee),0],
  ["매입가",a=>cell(a.purchase),0],["Loan",a=>cell(a.loan),0],
  ["'25 매출",a=>{const p=lastP(a.id);return p?`<span class="fig">${won(p.rev)}</span>`:'<span class="na">—</span>';},1],
  ["'25 영업이익",a=>{const p=lastP(a.id);return p?`<span class="fig" style="${p.op<0?'color:var(--neg)':''}">${won(p.op)}</span>`:'<span class="na">—</span>';},0],
  ["'25 ADR",a=>{const p=lastP(a.id);return p?`<span class="fig">${wonPlain(p.adr)}</span>`:'<span class="na">—</span>';},0],
  ["'25 점유율",a=>{const p=lastP(a.id);return p?`<span class="fig">${pct(p.occ)}</span>`:'<span class="na">—</span>';},0]
 ];
 function cell(f){if(f==null||f==="-"||f==="")return '<span class="na">—</span>';if(typeof f==="string")return f;let h=esc(f.v||f.title||"");if(f.items)h=esc(f.items.join(" / "));else if(f.note)h+=`<span class="sub">${esc(f.note)}</span>`;return h;}
 function cellCom(f){if(typeof f==="string")return f;if(f.v){let h=esc(f.v);if(f.note)h+=`<span class="sub">${esc(f.note)}</span>`;return h;}if(f.items)return esc(f.items.join(" · "));return '<span class="na">—</span>';}
 let head=`<thead><tr><th class="rowhead">항목</th>`;
 ASSETS.forEach(a=>head+=`<th><span class="grp">${GROUPS[a.group].en}</span><span class="cmp-name">${esc(a.name)}${siteLink(a,'sm')}</span></th>`);
 head+=`</tr></thead>`;
 let body="<tbody>";
 rows.forEach(([label,fn,div])=>{
  body+=`<tr class="${div?'divide':''}"><td class="rowhead">${label}</td>`;
  ASSETS.forEach(a=>body+=`<td class="fig">${fn(a)}</td>`);
  body+="</tr>";
 });
 body+="</tbody>";
 document.getElementById("cmp-table").innerHTML=head+body;
})();

/* ---------- tabs ---------- */
const tabs=document.querySelectorAll(".tab");
const views={detail:document.getElementById("view-detail"),compare:document.getElementById("view-compare")};
tabs.forEach(t=>t.addEventListener("click",()=>{
 const key=t.id==="tab-detail"?"detail":"compare";
 tabs.forEach(x=>x.setAttribute("aria-selected",x===t));
 Object.entries(views).forEach(([k,v])=>{const on=k===key;v.classList.toggle("hidden",!on);v.hidden=!on;});
}));

/* ---------- masthead revenue ---------- */
(function(){let s=0;Object.values(PERF).forEach(P=>s+=P[P.length-1].rev);
 document.getElementById("stat-rev").innerHTML=(s/1e8).toLocaleString("ko-KR",{maximumFractionDigits:0})+'<span class="u">억</span>';})();

select(0);
</script>
</body>
</html>
